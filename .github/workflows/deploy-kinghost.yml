name: Deploy KingHost

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - production

concurrency:
  group: kinghost-production
  cancel-in-progress: true

jobs:
  deploy-web:
    name: Build and publish Angular
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: src/VelvetMotors.Web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/VelvetMotors.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build -- --configuration production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: velvet-motors-web
          path: src/VelvetMotors.Web/dist/VelvetMotors.Web/browser
          if-no-files-found: error

      - name: Install FTP client
        run: sudo apt-get update && sudo apt-get install -y lftp
        working-directory: .

      - name: Deploy to KingHost by FTP
        run: |
          lftp -u "velvetmotors,${{ secrets.FTP_PASSWORD }}" ftp://ftp.web-ded-180026a.kinghost.net <<'FTP_COMMANDS'
          set ftp:ssl-allow no
          set ftp:passive-mode yes
          set net:timeout 20
          set net:max-retries 2
          mirror --reverse --delete --verbose --parallel=2 dist/VelvetMotors.Web/browser/ /www/
          bye
          FTP_COMMANDS
