name: Deploy KingHost

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
      - production

concurrency:
  group: kinghost-production
  cancel-in-progress: true

jobs:
  deploy-web:
    name: Build and publish Angular
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        working-directory: src/VelvetMotors.Web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/VelvetMotors.Web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build production bundle
        run: npm run build -- --configuration production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: velvet-motors-web
          path: src/VelvetMotors.Web/dist/VelvetMotors.Web/browser
          if-no-files-found: error

      - name: Deploy to KingHost by FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL }}
          local-dir: src/VelvetMotors.Web/dist/VelvetMotors.Web/browser/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
