<main class="admin-login">
  <section class="login-card">
    <a class="login-brand" routerLink="/">
      <span>VM</span>
      <strong>Velvet Motors</strong>
    </a>

    <div class="login-copy">
      <span class="eyebrow">Acesso administrativo</span>
      <h1>Painel Velvet.</h1>
      <p>Ambiente reservado para controlar frota, banners, chamadas da home, comparacoes e configuracoes comerciais do site.</p>
    </div>

    <form class="login-form">
      <label>
        E-mail
        <input type="email" value="admin@velvetmotors.com.br" autocomplete="email">
      </label>
      <label>
        Senha
        <input type="password" value="velvetdemo" autocomplete="current-password">
      </label>
      <a class="btn btn-primary" routerLink="/admin">
        <iconify-icon icon="lucide:log-in"></iconify-icon>
        Entrar no painel
      </a>
    </form>
  </section>

</main>
