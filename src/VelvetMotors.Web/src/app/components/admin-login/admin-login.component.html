<main class="admin-login">
  <section class="login-card">
    <a class="login-brand" routerLink="/">
      <img src="/images/logo/Aplicação 01.png" alt="Velvet Motors">
    </a>

    <div class="login-copy">
      <span class="eyebrow">Acesso administrativo</span>
      <h1>Painel Velvet.</h1>
      <p>Ambiente reservado para controlar veículos, banners, chamadas da home, comparações e configurações comerciais do site.</p>
    </div>

    <form class="login-form" data-testid="admin-login-form" (ngSubmit)="login()">
      <label>
        E-mail
        <input
          data-testid="admin-email"
          type="email"
          name="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          autocomplete="email">
      </label>
      <label>
        Senha
        <input
          data-testid="admin-password"
          type="password"
          name="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          autocomplete="current-password">
      </label>

      @if (errorMessage()) {
        <p class="form-alert">{{ errorMessage() }}</p>
      }

      <button class="btn btn-primary" data-testid="admin-login-submit" type="submit" [disabled]="loading()">
        <iconify-icon icon="lucide:log-in"></iconify-icon>
        {{ loading() ? 'Entrando...' : 'Entrar no painel' }}
      </button>
    </form>
  </section>

</main>
