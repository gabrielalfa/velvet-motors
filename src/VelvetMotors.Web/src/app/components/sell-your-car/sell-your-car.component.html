<section class="sell-page">
  <div class="section-shell sell-layout">
    <aside class="sell-intro">
      <a class="back-link" routerLink="/">
        <iconify-icon icon="lucide:arrow-left"></iconify-icon>
        Voltar
      </a>
      <span class="eyebrow">{{ content().sellEyebrow }}</span>
      <h1>{{ content().sellTitle }}</h1>
      <i></i>
      <p>{{ content().sellDescription }}</p>
      <p>Após a análise, você decide entre venda direta, troca ou consignação premium.</p>
    </aside>

    <main class="sell-form-card">
      <div class="steps">
        @for (step of steps; track step.number) {
          <div class="step" [class.step--active]="$index === 0">
            <span>{{ step.number }}</span>
            <strong>{{ step.title }}</strong>
            <small>{{ step.subtitle }}</small>
          </div>
        }
      </div>

      <app-feedback-modal [message]="feedback()" [type]="feedbackType()" (closed)="clearFeedback()"></app-feedback-modal>

      <form (ngSubmit)="submitProposal()">
        <label>
          <span>Marca</span>
          <input type="text" placeholder="BMW, Audi, Mercedes" name="make" [(ngModel)]="proposal.make" required>
        </label>
        <label>
          <span>Modelo</span>
          <input type="text" placeholder="Modelo" name="model" [(ngModel)]="proposal.model" required>
        </label>
        <label>
          <span>Ano</span>
          <input type="number" placeholder="2022" name="year" [(ngModel)]="proposal.year" required>
        </label>
        <label>
          <span>Transmissão</span>
          <input type="text" placeholder="Automático" name="transmission" [(ngModel)]="proposal.transmission">
        </label>
        <label>
          <span>Quilometragem</span>
          <input type="number" placeholder="32000" name="mileage" [(ngModel)]="proposal.mileage">
        </label>
        <label>
          <span>VIN</span>
          <input type="text" placeholder="Opcional" name="vin" [(ngModel)]="proposal.vin">
        </label>

        <div class="upload-row">
          <label>
            <span>Fotos do veículo</span>
            <button type="button">
              <iconify-icon icon="lucide:paperclip"></iconify-icon>
              Selecionar arquivos
            </button>
          </label>
          <label>
            <span>Video do veículo</span>
            <input type="url" placeholder="https://" name="videoUrl" [(ngModel)]="proposal.videoUrl">
          </label>
        </div>

        <label>
          <span>Cor externa</span>
          <input type="text" placeholder="Preto, branco, prata..." name="exteriorColor" [(ngModel)]="proposal.exteriorColor">
        </label>
        <label>
          <span>Cor interna</span>
          <input type="text" placeholder="Couro preto, caramelo..." name="interiorColor" [(ngModel)]="proposal.interiorColor">
        </label>
        <label>
            <span>Histórico</span>
          <input type="text" placeholder="Único dono, revisoes, observacoes" name="history" [(ngModel)]="proposal.history">
        </label>

        <label>
          <span>Seu nome</span>
          <input type="text" placeholder="Nome completo" name="customerName" [(ngModel)]="proposal.customerName" required>
        </label>
        <label>
          <span>E-mail</span>
          <input type="email" placeholder="voce@email.com" name="customerEmail" [(ngModel)]="proposal.customerEmail">
        </label>
        <label>
          <span>Telefone / WhatsApp</span>
            <input type="tel" placeholder="(54) 9 9307-2551" name="customerPhone" [(ngModel)]="proposal.customerPhone" required>
        </label>
        <label class="span-full">
          <span>Mensagem</span>
          <textarea placeholder="Conte um pouco sobre o veículo e seu objetivo." name="message" [(ngModel)]="proposal.message"></textarea>
        </label>

        <button class="btn btn-primary" type="submit" [disabled]="sending()">
          <iconify-icon icon="lucide:save"></iconify-icon>
          {{ sending() ? 'Enviando...' : 'Enviar avaliação' }}
        </button>
      </form>
    </main>
  </div>
</section>
