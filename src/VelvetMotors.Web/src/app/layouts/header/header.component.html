<header class="site-header" [class.site-header--scrolled]="isScrolled()">
  <a class="brand" routerLink="/" aria-label="Velvet Motors">
    <img class="brand__logo" src="/images/logo/Aplicação 01.png" [alt]="content().brandName">
  </a>

  <nav class="desktop-nav" aria-label="Navegacao principal">
    @for (item of navItems; track item.label) {
      <a [href]="item.href">
        {{ item.label }}
      </a>
    }
  </nav>

  <a class="header-cta" href="/#contato">
    <iconify-icon icon="lucide:calendar-check"></iconify-icon>
    {{ content().headerCtaLabel }}
  </a>

  <button class="menu-toggle" type="button" aria-label="Abrir menu" [attr.aria-expanded]="menuOpen()" (click)="toggleMenu()">
    <span></span>
    <span></span>
  </button>
</header>

<div class="mobile-panel" [class.mobile-panel--open]="menuOpen()">
  <div class="mobile-panel__surface">
    @for (item of navItems; track item.label) {
      <a [href]="item.href" (click)="closeMenu()">{{ item.label }}</a>
    }
    <a class="btn btn-primary" href="#contato" (click)="closeMenu()">{{ content().mobileCtaLabel }}</a>
  </div>
</div>
