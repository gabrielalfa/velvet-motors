<footer class="footer" id="contato">
  <div class="section-shell footer__grid">
    <div>
      <div class="footer__brand">
        <img src="/images/logo/Aplicação 01.png" [alt]="content().brandName">
      </div>
      <p>{{ content().footerDescription }}</p>
      <div class="socials">
        @for (social of socialLinks(); track social.label) {
          <a [href]="social.url" [attr.aria-label]="social.label" target="_blank" rel="noopener">
            <iconify-icon [icon]="social.icon"></iconify-icon>
          </a>
        }
      </div>
    </div>
    <div>
      <h3>Contato</h3>
      <p>{{ content().address }}</p>
      <p>{{ content().phone }}</p>
      <p>{{ content().hours }}</p>
    </div>
    <div>
      <h3>Links rapidos</h3>
      <a href="/veiculos">Veiculos</a>
      <a href="#sobre">Sobre a loja</a>
      <a href="#diferenciais">Diferenciais</a>
      <a href="#contato">Agendar visita</a>
      <a routerLink="/admin/login">Login adm</a>
    </div>
  </div>
</footer>
